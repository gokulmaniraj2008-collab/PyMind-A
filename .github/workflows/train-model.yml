name: PyMind-A CPU model training

on:
  push:
    branches: [main, feat/tinygpt-web-chat]
    paths:
      - "data/pymind_training.txt"
      - ".github/workflows/train-model.yml"
      - "pymind/train.py"
      - "pymind/model.py"
      - "pymind/tokenizer.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install numpy

      - name: Train small PyMind-A model
        run: |
          python -m pymind.train \
            --data data/pymind_training.txt \
            --max-iters 1500 \
            --eval-interval 250 \
            --eval-batches 4 \
            --batch-size 8 \
            --block-size 96 \
            --n-embd 64 \
            --n-head 4 \
            --n-layer 2 \
            --seed 1337 \
            --output checkpoints/tiny_gpt.pt \
            --metrics-output logs/training_metrics.csv

      - name: Evaluate trained model
        run: |
          python -m pymind.evaluate \
            --checkpoint checkpoints/tiny_gpt.pt \
            --data data/starter_ta_en.txt

      - name: Package checkpoint for inference hosting
        run: |
          mkdir -p artifacts
          zip -q -r artifacts/tinygpt-checkpoint.zip checkpoints/tiny_gpt.pt
          test -s artifacts/tinygpt-checkpoint.zip
          unzip -l artifacts/tinygpt-checkpoint.zip

      - name: Upload checkpoint and training metrics
        uses: actions/upload-artifact@v4
        with:
          name: pymind-a-trained-model
          path: |
            checkpoints/tiny_gpt.pt
            logs/training_metrics.csv
            artifacts/tinygpt-checkpoint.zip
          retention-days: 7

      - name: Publish checkpoint archive to this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/tinygpt-checkpoint.zip
          if git diff --cached --quiet; then
            echo "Checkpoint archive is already up to date."
          else
            git commit -m "Publish trained TinyGPT checkpoint archive"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

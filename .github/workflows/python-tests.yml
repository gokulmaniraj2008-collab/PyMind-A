name: PyMind-A Python CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU-only dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install numpy pytest

      - name: Run unit tests
        run: python -m pytest -q

      - name: Compile Python modules
        run: python -m compileall -q pymind tests app.py

      - name: Inspect Python coding assistant
        run: python -m pymind.coding pymind/model.py --fail-on-high

      - name: Smoke-test dataset cleaning
        run: python -m pymind.data_clean --input data/starter_ta_en.txt --output /tmp/pymind-cleaned.txt

      - name: Smoke-test training and generation
        run: |
          python -m pymind.train \
            --data data/input.txt \
            --max-iters 2 \
            --eval-interval 1 \
            --batch-size 4 \
            --block-size 32 \
            --n-embd 32 \
            --n-head 4 \
            --n-layer 1 \
            --output /tmp/pymind-smoke.pt
          python -m pymind.evaluate --checkpoint /tmp/pymind-smoke.pt --data data/starter_ta_en.txt
          python -m pymind.generate \
            --checkpoint /tmp/pymind-smoke.pt \
            --prompt "PyMind" \
            --max-new-tokens 5

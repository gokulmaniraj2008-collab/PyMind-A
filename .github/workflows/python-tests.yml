name: PyMind-A Python CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -q

      - name: Smoke-test training and generation
        run: |
          python -m pymind.train \
            --data data/input.txt \
            --max-iters 2 \
            --eval-interval 1 \
            --batch-size 4 \
            --block-size 32 \
            --n-embd 32 \
            --n-head 4 \
            --n-layer 1 \
            --output /tmp/pymind-smoke.pt
          python -m pymind.generate \
            --checkpoint /tmp/pymind-smoke.pt \
            --prompt "PyMind" \
            --max-new-tokens 5
